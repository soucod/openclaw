# 第一层：GitHub 推送后通知 CNB 拉取（全分支主路径）。
# 若通知失败或 CNB 未能在超时时间内拉取最新提交，自动在当前工作流中执行保底 Git 推送。
#
# Secret：支持 secrets.GIT_CNB_TOKEN 或 secrets.GIT_PASSWORD。
#   - 通知 API：Authorization: Bearer，权限是「触发构建」
#   - 保底推送：作为 git 密码，权限是「git 推送」

name: Notify CNB to pull

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notify-or-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trigger CNB api_trigger_github_push
        id: trigger
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GIT_CNB_TOKEN || secrets.GIT_PASSWORD }}
          CNB_REPO_SLUG: "soucod-github/soucod/openclaw"
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "缺少 Secret: 未找到 GIT_CNB_TOKEN 或 GIT_PASSWORD，跳过 notify 直接走保底"
            exit 1
          fi

          echo "正在通知 CNB 触发同步 (api_trigger_github_push)..."
          code=$(curl -sS -o /tmp/cnb-trigger.json -w '%{http_code}' \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -d "$(jq -n \
              --arg event "api_trigger_github_push" \
              --arg branch "${TARGET_BRANCH}" \
              --arg title "github notify pull" \
              '{event:$event, branch:$branch, title:$title}')" \
            "https://api.cnb.cool/${CNB_REPO_SLUG}/-/build/start") || {
            echo "调用 CNB API 失败"
            exit 1
          }

          echo "HTTP ${code}"
          cat /tmp/cnb-trigger.json || true
          echo

          case "$code" in
            2??) echo "CNB 接收通知成功，开始校验 CNB 分支是否已拉取最新提交..." ;;
            *) echo "CNB API 返回状态码异常: ${code}"; exit 1 ;;
          esac

          # 轮询校验 CNB 远端是否真正拉取了当前 commit
          synced=false
          for i in {1..5}; do
            remote_sha=$(git ls-remote "https://cnb.cool/${CNB_REPO_SLUG}.git" "refs/heads/${TARGET_BRANCH}" 2>/dev/null | awk '{print $1}' || true)
            echo "第 $i 次检查: CNB 远端 HEAD 为 [${remote_sha:-empty}]，预期 [${GITHUB_SHA}]"
            if [ "$remote_sha" = "$GITHUB_SHA" ]; then
              synced=true
              echo "CNB 已成功自动拉取最新提交！"
              break
            fi
            sleep 3
          done

          if [ "$synced" = "false" ]; then
            echo "CNB 未在超时时间内自动拉取该提交，转入保底推送..."
            exit 1
          fi

      - name: Fallback sync to CNB
        if: steps.trigger.outcome == 'failure'
        env:
          TOKEN: ${{ secrets.GIT_CNB_TOKEN || secrets.GIT_PASSWORD }}
          TARGET_URL: "https://cnb.cool/soucod-github/soucod/openclaw.git"
        run: |
          set -euo pipefail
          echo "走保底逻辑：直接 Git 推送至 CNB..."
          if [ -z "${TOKEN:-}" ]; then
            echo "错误: 缺少 Secret (GIT_CNB_TOKEN 或 GIT_PASSWORD)，无法推送至 CNB"
            exit 1
          fi

          auth_url="https://cnb:${TOKEN}@${TARGET_URL#https://}"
          git remote remove cnb 2>/dev/null || true
          git remote add cnb "$auth_url"
          git push --force cnb "${GITHUB_REF}:${GITHUB_REF}"
          git push --force cnb --tags || true
          echo "保底 Git 推送成功！CNB 仓库已更新至最新提交。"
