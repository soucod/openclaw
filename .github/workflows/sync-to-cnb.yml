# 独立保底：纯 git force push 到 CNB。不依赖 Docker。
# 支持在 GitHub Actions 页面通过 workflow_dispatch 手动一键触发全部分支与 Tag 同步。
#
# Secret：支持 secrets.GIT_CNB_TOKEN 或 secrets.GIT_PASSWORD。

name: Sync to CNB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push branches and tags to CNB
        env:
          TOKEN: ${{ secrets.GIT_CNB_TOKEN || secrets.GIT_PASSWORD }}
          TARGET_URL: "https://cnb.cool/soucod-github/soucod/openclaw.git"
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "缺少 Secret: 请在 GitHub 仓库配置 GIT_CNB_TOKEN 或 GIT_PASSWORD（需要 git 推送权限）"
            exit 1
          fi
          auth_url="https://cnb:${TOKEN}@${TARGET_URL#https://}"
          git remote remove cnb 2>/dev/null || true
          git remote add cnb "$auth_url"
          git push --force cnb --all
          git push --force cnb --tags || true
          echo "全部分支与 Tag 已同步至 CNB！"
